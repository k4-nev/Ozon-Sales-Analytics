<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Аналитика продаж по товарам</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%232E7D6F'/><path d='M32 15 L17 49 M32 15 L47 49 M21 40 L43 40' fill='none' stroke='white' stroke-width='8' stroke-linecap='round' stroke-linejoin='round'/></svg>">
<style>
  :root{
    --paper:#EAEEEC; --card:#FFFFFF; --ink:#12302A; --ink-soft:#5A6E68;
    --hair:#DCE3E0; --bar:#2E7D6F; --peak:#F2A03D; --peak-ink:#8A5410;
    --accent:#2E7D6F;
    --sh-sm:0 1px 2px rgba(18,48,42,.06), 0 2px 6px -1px rgba(18,48,42,.05);
    --sh-md:0 1px 3px rgba(18,48,42,.05), 0 6px 16px -6px rgba(18,48,42,.10);
    --sh-lg:0 8px 26px -8px rgba(18,48,42,.16);
    --ease:cubic-bezier(.2,.7,.3,1);
  }
  *{box-sizing:border-box;margin:0;padding:0;scrollbar-width:thin;scrollbar-color:#BFCEC8 transparent}
  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:#BFCEC8;border-radius:20px;border:3px solid transparent;background-clip:content-box}
  ::-webkit-scrollbar-thumb:hover{background:#A3B5AE;background-clip:content-box}
  html,body{height:100%}
  body{
    font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,Helvetica,Arial,sans-serif;
    background:
      radial-gradient(1200px 600px at 100% -10%, #EFF3F1 0%, transparent 60%),
      var(--paper);
    color:var(--ink); -webkit-font-smoothing:antialiased; min-height:100vh;
  }
  button{font-family:inherit;cursor:pointer}
  .app{max-width:1320px;margin:0 auto;padding:28px 22px 48px}

  /* ---------- animations ---------- */
  @keyframes fadeUp{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
  @keyframes barGrow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
  @keyframes pop{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
  .fadeUp{animation:fadeUp .24s var(--ease) both}

  /* ---------- masthead ---------- */
  .masthead{
    display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;
    border-bottom:2px solid var(--ink);padding-bottom:16px;
  }
  .masthead h1{font-size:clamp(22px,3.4vw,32px);font-weight:800;letter-spacing:-.02em;line-height:1}
  .masthead .meta{color:var(--ink-soft);font-size:13px;margin-top:9px;line-height:1.5}
  .masthead .meta b{color:var(--ink);font-weight:700}
  .btn{
    border:none;background:linear-gradient(180deg,#1c443b,#12302A);color:#fff;font-size:13px;font-weight:600;
    padding:10px 16px;border-radius:10px;white-space:nowrap;box-shadow:var(--sh-sm),0 3px 8px -2px rgba(18,48,42,.4);
    transition:transform .12s var(--ease),box-shadow .12s var(--ease),opacity .12s;
  }
  .btn:hover{transform:translateY(-1px);box-shadow:var(--sh-md),0 6px 14px -3px rgba(18,48,42,.42)}
  .btn:active{transform:translateY(1px) scale(.99);box-shadow:var(--sh-sm)}
  .btn.ghost{background:#fff;color:var(--ink);box-shadow:var(--sh-sm)}
  .btn.ghost:hover{background:#fff;transform:translateY(-1px);box-shadow:var(--sh-md)}

  /* ---------- view toolbar (chart selector) ---------- */
  .viewbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:16px 2px 16px}
  .viewbar-label{font-size:12px;font-weight:600;color:var(--ink-soft)}
  .chiprow{display:flex;gap:8px;flex-wrap:wrap}
  .chip{
    border:1px solid var(--hair);background:#fff;color:var(--ink-soft);font-size:12.5px;font-weight:600;
    padding:7px 14px 7px 11px;border-radius:999px;display:inline-flex;align-items:center;gap:7px;
    box-shadow:var(--sh-sm);
    transition:transform .12s var(--ease),box-shadow .14s var(--ease),background .14s var(--ease),color .14s var(--ease),border-color .14s var(--ease);
  }
  .chip .tick{width:15px;height:15px;border-radius:50%;border:1.5px solid #C3D0CB;display:inline-flex;align-items:center;justify-content:center;transition:border-color .14s var(--ease),background .14s var(--ease)}
  .chip .tick svg{width:9px;height:9px;opacity:0;transform:scale(.4);transition:opacity .14s var(--ease),transform .14s var(--ease);stroke:#fff;stroke-width:3.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .chip:hover{transform:translateY(-1px);box-shadow:var(--sh-md);color:var(--ink)}
  .chip:active{transform:translateY(0) scale(.97)}
  .chip.on{background:linear-gradient(180deg,#34917f,#2E7D6F);color:#fff;border-color:transparent;box-shadow:0 5px 13px -3px rgba(46,125,111,.5)}
  .chip.on:hover{color:#fff}
  .chip.on .tick{border-color:rgba(255,255,255,.9);background:rgba(255,255,255,.2)}
  .chip.on .tick svg{opacity:1;transform:scale(1)}
  .dbtns{display:flex;gap:9px;flex-wrap:wrap}

  /* ---------- profile bar ---------- */
  .profilebar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
    background:var(--card);border:1px solid var(--hair);border-radius:14px;padding:11px 16px;margin-bottom:16px;box-shadow:var(--sh-sm)}
  .pb-left{display:flex;align-items:center;gap:10px;min-width:0}
  .pb-ic{width:30px;height:30px;flex:none;border-radius:8px;background:#E7F1EE;color:var(--accent);display:flex;align-items:center;justify-content:center}
  .pb-ic svg{width:17px;height:17px}
  .pb-label{font-size:11px;font-weight:600;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.05em}
  .pb-name{font-size:15px;font-weight:800;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw}
  .pb-count{font-size:11.5px;color:var(--ink-soft);background:#EEF2F0;border-radius:999px;padding:3px 9px;white-space:nowrap}

  /* ---------- profiles modal ---------- */
  .overlay{position:fixed;inset:0;background:rgba(18,48,42,.34);backdrop-filter:blur(2px);display:flex;align-items:flex-start;justify-content:center;padding:60px 18px;z-index:60;animation:overlayIn .16s var(--ease) both}
  @keyframes overlayIn{from{opacity:0}to{opacity:1}}
  .modal{width:100%;max-width:520px;background:var(--card);border-radius:18px;box-shadow:0 30px 70px -20px rgba(0,0,0,.5);padding:20px;animation:pop .2s var(--ease) both;max-height:80vh;display:flex;flex-direction:column}
  .modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .modal-head h3{font-size:18px;font-weight:800}
  .mclose{border:none;background:#EEF2F0;color:var(--ink-soft);width:30px;height:30px;border-radius:8px;font-size:14px;line-height:1;transition:background .12s var(--ease),color .12s var(--ease)}
  .mclose:hover{background:#e2e8e6;color:var(--ink)}
  .createrow{display:flex;gap:9px;margin-bottom:14px}
  .pinput{flex:1;min-width:0;border:1px solid var(--hair);border-radius:10px;padding:11px 13px;font-size:14px;color:var(--ink);background:#F5F8F7;outline:none;transition:border-color .14s var(--ease),background .14s var(--ease),box-shadow .14s var(--ease)}
  .pinput:focus{border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px rgba(46,125,111,.14)}
  .prows{display:flex;flex-direction:column;gap:9px;overflow:auto;padding:2px}
  .prow{display:flex;align-items:stretch;gap:8px;border:1px solid var(--hair);border-radius:12px;padding:4px;box-shadow:var(--sh-sm);transition:border-color .14s var(--ease),box-shadow .14s var(--ease)}
  .prow.active{border-color:transparent;box-shadow:0 0 0 1.5px var(--accent),0 8px 18px -10px rgba(46,125,111,.4)}
  .popen{flex:1;min-width:0;text-align:left;border:none;background:transparent;padding:9px 10px;border-radius:9px;display:flex;flex-direction:column;gap:3px;transition:background .12s var(--ease)}
  .popen:hover{background:#F1F6F4}
  .pn{font-size:14px;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:8px}
  .badge{font-size:9.5px;font-weight:700;color:#fff;background:var(--accent);border-radius:999px;padding:2px 7px;text-transform:uppercase;letter-spacing:.03em}
  .pm{font-size:11.5px;color:var(--ink-soft)}
  .mini{border:none;background:#EEF2F0;color:var(--ink-soft);border-radius:8px;padding:0 12px;font-size:12.5px;font-weight:600;align-self:center;height:32px;transition:background .12s var(--ease),color .12s var(--ease)}
  .mini:hover{background:#e2e8e6;color:var(--ink)}
  .mini.del{width:34px;padding:0;font-size:13px}
  .mini.del:hover{background:#f6dede;color:#b3261e}
  .mini.danger{background:#e5484d;color:#fff}
  .mini.danger:hover{background:#cf3b40;color:#fff}
  .confirm{display:flex;align-items:center;gap:6px;align-self:center;padding-right:4px}
  .confirm .q{font-size:12px;color:var(--ink-soft)}
  .empty{padding:24px;text-align:center;color:var(--ink-soft);font-size:13px}

  /* ---------- arrow button + drawer ---------- */
  .mast-left{display:flex;align-items:flex-start;gap:12px;min-width:0}
  .solo-arrow{margin-bottom:16px}
  .arrowbtn{flex:none;width:40px;height:40px;border:1px solid var(--hair);background:var(--card);color:var(--ink);border-radius:11px;display:flex;align-items:center;justify-content:center;box-shadow:var(--sh-sm);transition:transform .12s var(--ease),box-shadow .14s var(--ease),background .14s var(--ease);margin-top:2px}
  .arrowbtn svg{width:20px;height:20px}
  .arrowbtn:hover{transform:translateY(-1px);box-shadow:var(--sh-md);background:#F3F7F5}
  .arrowbtn:active{transform:translateY(0) scale(.95)}
  .drawer-overlay{position:fixed;inset:0;background:rgba(18,48,42,.34);backdrop-filter:blur(2px);z-index:60;opacity:0;transition:opacity .2s var(--ease)}
  .drawer-overlay.open{opacity:1}
  .drawer{position:fixed;top:0;left:0;height:100vh;width:344px;max-width:88vw;background:var(--card);
    box-shadow:10px 0 44px -14px rgba(0,0,0,.42);display:flex;flex-direction:column;padding:18px 14px 16px;
    transform:translateX(-103%);transition:transform .22s var(--ease)}
  .drawer-overlay.open .drawer{transform:translateX(0)}
  .drawer-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex:none;padding:0 2px}
  .drawer-head h3{font-size:18px;font-weight:800}
  .drawer-tools{flex:none;display:flex;flex-direction:column;gap:10px;margin-bottom:12px;padding:0 2px}
  .drawer-list{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:9px;padding:2px 6px 2px 2px}

  /* ---------- upload ---------- */
  .upload-wrap{display:flex;align-items:center;justify-content:center;min-height:60vh}
  .drop{
    width:100%;max-width:560px;background:var(--card);border:2px dashed #C3D0CB;border-radius:20px;
    padding:48px 32px;text-align:center;box-shadow:var(--sh-md);
    transition:border-color .16s var(--ease),background .16s var(--ease),transform .16s var(--ease),box-shadow .16s var(--ease);
    animation:pop .3s var(--ease) both;
  }
  .drop.over{border-color:var(--accent);background:#F3F9F7;transform:translateY(-3px) scale(1.01);box-shadow:var(--sh-lg)}
  .drop h2{font-size:20px;font-weight:800;margin-bottom:10px}
  .drop p{color:var(--ink-soft);font-size:13.5px;line-height:1.6;margin-bottom:22px}
  .drop .hint{font-size:12px;color:var(--ink-soft);margin-top:18px;line-height:1.6}
  .drop .icon{width:54px;height:54px;margin:0 auto 18px;color:var(--accent);transition:transform .2s var(--ease)}
  .drop.over .icon{transform:translateY(-4px)}
  .csvguide{margin:18px 0 6px;text-align:left;border:1px solid var(--hair);border-radius:12px;overflow:hidden;background:#F7FAF9;box-shadow:var(--sh-sm)}
  .cg-title{font-size:12px;font-weight:700;color:var(--ink);padding:9px 12px;background:#EDF3F1;border-bottom:1px solid var(--hair)}
  .cg-row{display:grid;grid-template-columns:1.15fr 1.5fr .95fr .55fr}
  .cg-row+.cg-row{border-top:1px solid #E6ECEA}
  .cg-row span{padding:7px 10px;font-size:11px;color:var(--ink-soft);border-right:1px solid #E6ECEA;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cg-row span:last-child{border-right:none}
  .cg-head{background:#fff}
  .cg-head span{font-weight:700;color:var(--ink);font-size:10.5px}
  .cg-note{font-size:11px;color:var(--ink-soft);padding:9px 12px;line-height:1.5;border-top:1px solid var(--hair)}
  .cg-note b{color:var(--ink)}

  /* ---------- layout ---------- */
  .layout{display:grid;grid-template-columns:344px minmax(0,1fr);gap:24px;margin-top:22px;align-items:start}
  @media(max-width:900px){.layout{grid-template-columns:minmax(0,1fr)}}
  .detail{min-width:0}

  /* ---------- sidebar ---------- */
  .side{position:sticky;top:20px}
  @media(max-width:900px){.side{position:static}}
  .storecard{
    position:relative;width:100%;display:flex;align-items:center;gap:12px;margin-bottom:14px;text-align:left;
    border:none;border-radius:14px;padding:14px 15px;color:#fff;cursor:pointer;
    background:linear-gradient(135deg,#348a7b,#255f54);
    box-shadow:0 9px 22px -9px rgba(46,125,111,.55),var(--sh-sm);
    transition:transform .13s var(--ease),box-shadow .16s var(--ease);
  }
  .storecard:hover{transform:translateY(-2px);box-shadow:0 13px 28px -9px rgba(46,125,111,.6)}
  .storecard:active{transform:translateY(0) scale(.995)}
  .storecard.sel{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--accent),0 13px 28px -9px rgba(46,125,111,.6)}
  .storecard .ic{width:34px;height:34px;flex:none;border-radius:9px;background:rgba(255,255,255,.17);display:flex;align-items:center;justify-content:center;color:#fff}
  .storecard .ic svg{width:19px;height:19px}
  .storecard .txt{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
  .storecard .t1{font-size:14px;font-weight:800;line-height:1.1}
  .storecard .t2{font-size:11px;opacity:.85;line-height:1.2}
  .storecard .v{font-size:16px;font-weight:800;line-height:1;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  .storecard .v small{display:block;font-size:8.5px;font-weight:600;opacity:.82;text-transform:uppercase;letter-spacing:.04em;margin-top:3px}

  .side-tools{background:var(--card);border:1px solid var(--hair);border-radius:14px;padding:12px;margin-bottom:14px;box-shadow:var(--sh-sm)}
  .search{
    width:100%;border:1px solid var(--hair);border-radius:9px;padding:10px 12px;font-size:13.5px;
    color:var(--ink);background:#F5F8F7;outline:none;transition:border-color .14s var(--ease),background .14s var(--ease),box-shadow .14s var(--ease);
  }
  .search:focus{border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px rgba(46,125,111,.14)}
  .sort{display:flex;gap:5px;margin-top:10px;background:#E7EDEA;border-radius:10px;padding:4px}
  .sort button{
    flex:1;border:none;background:transparent;color:var(--ink-soft);font-size:11.5px;font-weight:600;
    padding:8px 4px;border-radius:7px;line-height:1.2;transition:color .14s var(--ease),background .14s var(--ease),box-shadow .14s var(--ease),transform .1s var(--ease);
  }
  .sort button:hover{color:var(--ink)}
  .sort button:active{transform:scale(.96)}
  .sort button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08),0 2px 6px -2px rgba(0,0,0,.12)}
  .count-line{font-size:11.5px;color:var(--ink-soft);padding:2px 4px 10px}

  .plist{display:flex;flex-direction:column;gap:10px;max-height:72vh;overflow:auto;padding:2px 6px 2px 2px}
  @media(max-width:900px){.plist{max-height:none}}
  .pcard{
    position:relative;flex:0 0 auto;text-align:left;width:100%;background:var(--card);border:1px solid var(--hair);
    border-radius:13px;padding:13px 14px 13px 15px;display:flex;flex-direction:column;gap:8px;overflow:hidden;
    box-shadow:var(--sh-sm);
    transition:transform .13s var(--ease),box-shadow .16s var(--ease),background .16s var(--ease),border-color .16s var(--ease);
  }
  .pcard::before{
    content:'';position:absolute;left:0;top:50%;height:0;width:4px;border-radius:0 4px 4px 0;
    background:var(--accent);transform:translateY(-50%);
    transition:height .18s var(--ease);
  }
  .pcard:hover{transform:translateY(-2px);box-shadow:var(--sh-md);border-color:#CBD8D2}
  .pcard:active{transform:translateY(0) scale(.995)}
  .pcard.sel{
    background:linear-gradient(180deg,#F6FBF9,#EEF6F3);border-color:transparent;
    box-shadow:0 10px 24px -10px rgba(46,125,111,.45),0 3px 8px -3px rgba(46,125,111,.28);
    transform:translateY(-1px);
  }
  .pcard.sel::before{height:calc(100% - 22px)}
  .pcard .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
  .pcard .nm{font-size:13px;font-weight:700;line-height:1.35;color:var(--ink);
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .pcard .tot{font-size:17px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap;transition:color .16s var(--ease)}
  .pcard.sel .tot{color:var(--accent)}
  .pcard .tot small{display:block;font-size:9px;font-weight:600;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;margin-top:3px;text-align:right}
  .pcard .bot{display:flex;justify-content:space-between;align-items:flex-end;gap:8px}
  .pcard .sku{font-size:11px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
  .spark{display:block}

  /* ---------- detail ---------- */
  .detail-empty{background:var(--card);border:1px solid var(--hair);border-radius:16px;padding:60px 30px;text-align:center;color:var(--ink-soft);box-shadow:var(--sh-md);animation:pop .28s var(--ease) both}
  .detail-empty h3{color:var(--ink);font-size:17px;margin-bottom:8px}
  .dhead{
    display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;
    background:var(--card);border:1px solid var(--hair);border-radius:16px;padding:18px 20px;margin-bottom:18px;box-shadow:var(--sh-md);
  }
  .dhead h2{font-size:18px;font-weight:800;line-height:1.3;max-width:640px}
  .dhead .sku{font-size:12.5px;color:var(--ink-soft);margin-top:6px}
  .tabbar{display:flex;gap:6px;background:var(--card);border:1px solid var(--hair);border-radius:14px;padding:5px;margin-bottom:18px;box-shadow:var(--sh-sm);overflow-x:auto}
  .dtab{flex:1;min-width:max-content;border:none;background:transparent;border-radius:10px;padding:10px 14px;font-size:13px;font-weight:700;color:var(--ink-soft);cursor:pointer;white-space:nowrap;transition:background .14s var(--ease),color .14s var(--ease),box-shadow .14s var(--ease)}
  .dtab:hover{color:var(--ink)}
  .dtab.on{background:var(--accent);color:#fff;box-shadow:var(--sh-sm)}
  .legend{display:flex;gap:18px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--ink-soft);margin:0 2px 16px}
  .legend span{display:inline-flex;align-items:center;gap:7px}
  .swatch{width:13px;height:13px;border-radius:4px;display:inline-block;box-shadow:0 1px 2px rgba(0,0,0,.12)}

  .panel{background:var(--card);border:1px solid var(--hair);border-radius:16px;padding:20px 20px 12px;margin-bottom:18px;box-shadow:var(--sh-md);min-width:0}
  .panel-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:2px}
  .panel-head h3{font-size:17px;font-weight:800;letter-spacing:-.01em}
  .panel-head .span{font-size:11.5px;color:var(--ink-soft)}
  .stats{display:flex;gap:24px;margin:11px 0 14px;flex-wrap:wrap}
  .stat .n{font-size:21px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
  .stat .l{font-size:10.5px;color:var(--ink-soft);margin-top:5px;text-transform:uppercase;letter-spacing:.05em}
  .peakcard{display:flex;align-items:center;gap:10px;background:linear-gradient(180deg,#FEF6EA,#FDF1DE);border:1px solid #F1D9AE;border-radius:11px;padding:9px 13px;margin-bottom:14px;width:fit-content;box-shadow:0 2px 8px -3px rgba(242,160,61,.4)}
  .peakcard .dot{width:10px;height:10px;border-radius:50%;background:var(--peak);flex:none;box-shadow:0 0 0 3px rgba(242,160,61,.25)}
  .peakcard .t{font-size:12.5px;color:var(--peak-ink);line-height:1.4}
  .peakcard .t b{font-size:14px}
  .noorders{background:#F4F7F6;border:1px dashed #C7D2CE;border-radius:12px;padding:26px;text-align:center;color:var(--ink-soft);font-size:13px}
  .chart{width:100%;height:auto;display:block}
  .chart rect{transform-box:fill-box;transform-origin:50% 100%;animation:barGrow .34s var(--ease) both}

<body>
<div class="app" id="app"></div>
<div class="toast" id="toast"></div>
<div id="modalHost"></div>
<input type="file" id="fileInput" accept=".csv,text/csv">

<script>
/* ===================== CONFIG / COLORS ===================== */
const C={BAR:'#2E7D6F',PEAK:'#F2A03D',GRID:'#DCE3E0',INK:'#12302A',INKSOFT:'#5A6E68',PEAKINK:'#8A5410',PAID:'#3E7CB1'};
const STORE_KEY='analyse_store_v1';
const PROFILES_KEY='analyse_profiles_v1';
const ACTIVE_KEY='analyse_active_profile_v1';
const PKEY=id=>'analyse_profile_'+id;
const ALL_KEY='__ALL__';
const CHART_KEY='analyse_charts_v1';
const CALC_KEY='analyse_calc_v1';       // per-SKU calculator inputs (global, cross-profile)

/* ===================== CORE LOGIC ===================== */
// Full CSV parser: handles quoted fields, embedded ';' and newlines, "" escapes. Delimiter ';'.
function parseCSVText(text){
  text=text.replace(/^\uFEFF/,'');
  const rows=[]; let field='', row=[], inQ=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(inQ){
      if(c==='"'){ if(text[i+1]==='"'){ field+='"'; i++; } else inQ=false; }
      else field+=c;
    } else {
      if(c==='"') inQ=true;
      else if(c===';'){ row.push(field); field=''; }
      else if(c==='\n'){ row.push(field); rows.push(row); row=[]; field=''; }
      else if(c==='\r'){ /* ignore */ }
      else field+=c;
    }
  }
  if(field.length||row.length){ row.push(field); rows.push(row); }
  return rows;
}
function parseDateAny(dt){
  dt=(dt||'').trim();
  let m=dt.match(/^(\d{4})-(\d{2})-(\d{2})[ T](\d{1,2}):(\d{2})/);          // ISO 2026-08-02 20:37
  if(m) return {serial:Date.UTC(+m[1],+m[2]-1,+m[3]),hour:+m[4],dayKey:`${m[1]}-${m[2]}-${m[3]}`};
  m=dt.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})\s+(\d{1,2}):(\d{2})/);          // dd.mm.yyyy 02.08.2026 20:37
  if(m){ const p=n=>String(n).padStart(2,'0'); return {serial:Date.UTC(+m[3],+m[2]-1,+m[1]),hour:+m[4],dayKey:`${m[3]}-${p(+m[2])}-${p(+m[1])}`}; }
  return null;
}
function fmtDate(s){const d=new Date(s),p=n=>String(n).padStart(2,'0');
  return `${p(d.getUTCDate())}.${p(d.getUTCMonth()+1)}.${d.getUTCFullYear()}`;}
function num(x){ const v=parseFloat(String(x==null?'':x).replace(/\s/g,'').replace(',','.')); return Number.isFinite(v)?v:0; }
function fmtMoney(v){ v=Math.round(v||0); const s=Math.abs(v).toString().replace(/\B(?=(\d{3})+(?!\d))/g,' '); return (v<0?'-':'')+s; }
function moneyShort(v){ if(v>=1000){ const k=v/1000; return (Math.round(k*10)/10).toString().replace('.',',')+'к'; } return String(v); }

function processCSV(text){
  const rows=parseCSVText(text);
  if(!rows.length) return {error:'Пустой файл.'};
  const header=rows[0].map(h=>(h||'').trim());
  const idx=name=>header.indexOf(name);
  const iDate=idx('Принят в обработку');
  const iName=idx('Название товара')>=0?idx('Название товара'):idx('Название');
  const iSku=idx('SKU');
  const iQty=idx('Количество');
  const iShip=idx('Сумма отправления');
  const iPaid=idx('Оплачено покупателем');
  const iClu=idx('Кластер доставки');
  const iReg=idx('Регион доставки');
  const iCity=idx('Город доставки');
  const iStatus=idx('Статус');
  if(iDate<0||iSku<0||iQty<0) return {error:'Не найдены нужные столбцы. Загрузите отчёт «Доставки FBO» из Ozon Seller.'};
  const raw=[]; let minS=Infinity,maxS=-Infinity;
  for(let r=1;r<rows.length;r++){
    const row=rows[r]; if(!row||row.length<=iSku) continue;
    const pd=parseDateAny(row[iDate]); if(!pd) continue;
    const sku=(row[iSku]||'').trim(); if(!sku) continue;
    const name=((iName>=0?row[iName]:'')||'').trim()||('SKU '+sku);
    const q=parseInt(String(row[iQty]||'').trim(),10); const qty=Number.isFinite(q)?q:0;
    const ship=iShip>=0?num(row[iShip]):0;
    const paid=iPaid>=0?num(row[iPaid]):0;
    let cluster=((iClu>=0?row[iClu]:'')||'').trim();
    if(!cluster && iReg>=0) cluster=(row[iReg]||'').trim();
    if(!cluster && iCity>=0) cluster=(row[iCity]||'').trim();
    if(!cluster) cluster='Не указан';
    const status=((iStatus>=0?row[iStatus]:'')||'').trim();
    const st = iStatus<0 ? 'd' : statusCat(status);   // no status column -> treat as delivered
    raw.push({sku,name,serial:pd.serial,hour:pd.hour,qty,ship,paid,cluster,st});
    if(pd.serial<minS)minS=pd.serial; if(pd.serial>maxS)maxS=pd.serial;
  }
  if(!raw.length) return {error:'В файле не найдено ни одной строки заказа. Загрузите отчёт «Доставки FBO» из Ozon Seller.'};
  const DAY=86400000;
  const days=[]; const dayIndex=new Map();
  for(let s=minS;s<=maxS;s+=DAY){ const d=new Date(s),p=n=>String(n).padStart(2,'0');
    const key=`${d.getUTCFullYear()}-${p(d.getUTCMonth()+1)}-${p(d.getUTCDate())}`;
    dayIndex.set(key,days.length); days.push({key,label:`${p(d.getUTCDate())}.${p(d.getUTCMonth()+1)}`}); }
  const D=days.length;
  const bySku=new Map(), nameCount=new Map();
  let totalOrders=0,totalQty=0,shipTotal=0,paidTotal=0,returnsCount=0,processingCount=0,deliveredCount=0;
  for(const r of raw){
    let p=bySku.get(r.sku);
    if(!p){ p={sku:r.sku,name:r.name,recs:[]}; bySku.set(r.sku,p); nameCount.set(r.sku,new Map()); }
    const nc=nameCount.get(r.sku); nc.set(r.name,(nc.get(r.name)||0)+1);
    const dk=new Date(r.serial),p2=n=>String(n).padStart(2,'0');
    const di=dayIndex.get(`${dk.getUTCFullYear()}-${p2(dk.getUTCMonth()+1)}-${p2(dk.getUTCDate())}`)||0;
    p.recs.push({d:di,h:r.hour,q:r.qty,sh:r.ship,pd:r.paid,cl:r.cluster,st:r.st,x:r.st==='c'?1:0});
    totalOrders++; totalQty+=r.qty; shipTotal+=r.ship; paidTotal+=r.paid;
    if(r.st==='c') returnsCount++; else if(r.st==='p') processingCount++; else deliveredCount++;
  }
  for(const [sku,p] of bySku){ const nc=nameCount.get(sku); let best=null,bestN=-1; for(const [name,n] of nc){ if(n>bestN){bestN=n;best=name;} } p.name=best; }
  const spanDays=D;
  return {products:[...bySku.values()],meta:{
    totalOrders,totalQty,productCount:bySku.size,shipTotal,paidTotal,returnsCount,processingCount,deliveredCount,
    minDate:fmtDate(minS),maxDate:fmtDate(maxS),
    days, spanDays, anchorIdx:D-1, periodOptions:periodOptions(spanDays)
  }};
}
function statusCat(status){
  const s=(status||'').toLowerCase();
  if(/отмен|возврат|отказ/.test(s)) return 'c';        // Отменён / возврат / отказ -> возврат
  if(/^доставлен/.test(s)) return 'd';                  // Доставлен (не «Доставляется»)
  return 'p';                                           // Доставляется, Ожидает отгрузки/сборки и пр. -> в обработке
}

/* ---- period options based on the loaded span ---- */
function periodOptions(span){
  const S=Math.min(span,90);
  const std=[[7,'Неделя'],[14,'2 недели'],[30,'Месяц'],[60,'2 месяца'],[90,'3 месяца']];
  const map={7:'Неделя',14:'2 недели',30:'Месяц',60:'2 месяца',90:'3 месяца'};
  const opts=[];
  for(const [d,l] of std){ if(d<S) opts.push({days:d,label:l}); }
  opts.push({days:S,label: map[S] || ('за '+S+' '+plural(S,'день','дня','дней'))});
  return opts;
}
function defaultPeriodDays(){ const o=DATA&&DATA.meta&&DATA.meta.periodOptions; return o&&o.length?o[o.length-1].days:7; }
function clampPeriod(){
  const o=DATA&&DATA.meta&&DATA.meta.periodOptions||[];
  if(!o.some(x=>x.days===selectedPeriodDays)) selectedPeriodDays=defaultPeriodDays();
}

/* ---- window aggregation over the last N days ---- */
function recsForSelection(){
  if(selectedSku===ALL_KEY){ const all=[]; for(const p of DATA.products) for(const r of p.recs) all.push(r); return all; }
  const p=DATA.products.find(x=>x.sku===selectedSku); return p?p.recs:[];
}
function computeAgg(recs, N){
  const D=DATA.meta.days.length, from=Math.max(0, D-N);
  const dayN=D-from;
  const hourly=Array(24).fill(0), ship=Array(dayN).fill(0), paid=Array(dayN).fill(0);
  const clusters={}; let qty=0,shipTot=0,paidTot=0;
  const ret={count:0,qty:0,ship:0,paid:0}, del={count:0,ship:0,paid:0,qty:0}, proc={count:0,ship:0,paid:0,qty:0};
  for(const r of recs){ if(r.d<from) continue;
    const st = r.st || (r.x?'c':'d');
    hourly[r.h]+=r.q;                                  // все статусы (интервалы времени)
    const di=r.d-from; ship[di]+=r.sh; paid[di]+=r.pd; // все статусы (доход по дням)
    clusters[r.cl]=(clusters[r.cl]||0)+r.q;            // все статусы (кластеры)
    qty+=r.q; shipTot+=r.sh; paidTot+=r.pd;
    if(st==='c'){ ret.count++; ret.qty+=r.q; ret.ship+=r.sh; ret.paid+=r.pd; }
    else if(st==='p'){ proc.count++; proc.qty+=r.q; proc.ship+=r.sh; proc.paid+=r.pd; }
    else { del.count++; del.qty+=r.q; del.ship+=r.sh; del.paid+=r.pd; }
  }
  const labels=DATA.meta.days.slice(from).map(d=>d.label);
  return {hourly,ship,paid,labels,clusters,qty,shipTot,paidTot,returns:ret,delivered:del,processing:proc,fromIdx:from,dayN,
          minDate:DATA.meta.days[from].label, maxDate:DATA.meta.days[D-1].label};
}
function currentView(){ return computeAgg(recsForSelection(), selectedPeriodDays); }
function currentName(){ if(selectedSku===ALL_KEY) return 'Весь магазин'; const p=DATA.products.find(x=>x.sku===selectedSku); return p?p.name:''; }
function periodLabel(){ const o=(DATA.meta.periodOptions||[]).find(x=>x.days===selectedPeriodDays); return o?o.label:(selectedPeriodDays+' дн.'); }

/* ===================== PROFIT CALCULATOR ===================== */
const CALC_DEFAULTS={paidOff:true,model:'fbo',fboMin:47,fboMax:49,fbsMin:45,fbsMax:50,feeOff:false,cogs:null,cogsOff:false,ads:15,adsOff:false,taxMode:'usn6',otherRate:1.5};
let calcData={};   // { SKU: {inputs...} }
function loadCalc(){ try{ const raw=store.get(CALC_KEY); if(raw) calcData=JSON.parse(raw)||{}; }catch(e){ calcData={}; } }
function saveCalc(){ store.set(CALC_KEY, JSON.stringify(calcData)); }
function calcFor(sku){ return Object.assign({}, CALC_DEFAULTS, calcData[sku]||{}); }
function setCalc(sku, patch){ calcData[sku]=Object.assign({}, calcFor(sku), patch); saveCalc(); }
function calcComplete(sku){ const c=calcData[sku]; if(!c) return false; const cogs=c.cogs; return !c.cogsOff && Number.isFinite(cogs) && cogs>0; }

// Net profit for a product over the window. Realized profit counts ONLY delivered orders;
// processing orders (Доставляется/Ожидает…) are surfaced separately as "в обработке".
function profitFor(sku, view){
  const c=calcFor(sku);
  const del=view.delivered||{ship:0,paid:0,qty:0,count:0};
  const proc=view.processing||{ship:0,paid:0,qty:0,count:0};
  const price=del.ship, paid=del.paid, qty=del.qty;
  const feeMin = c.model==='fbo'?(+c.fboMin||0):(+c.fbsMin||0);
  const feeMax = c.model==='fbo'?(+c.fboMax||0):(+c.fbsMax||0);
  const avg=(feeMin+feeMax)/2;
  const runFor=(pr,q)=>(feePct)=>{
    const fFee=c.feeOff?0:pr*feePct/100;
    const fAds=c.adsOff?0:pr*(+c.ads||0)/100;
    const fCogs=c.cogsOff?0:(+c.cogs||0)*q;
    const pbt=pr-fFee-fAds-fCogs;
    let tax=0, isMin=false;
    if(c.taxMode==='usn6') tax=pr*0.06;
    else if(c.taxMode==='usn15'){ const reg=pbt*0.15, mn=pr*0.01; tax=Math.max(reg,mn); isMin=mn>=reg; }
    else if(c.taxMode==='other') tax=pr*(+c.otherRate||0)/100;
    return {net:pbt-tax,tax,pbt,isMin,fFee,fAds,fCogs};
  };
  const run=runFor(price,qty);
  const main=run(avg), low=run(feeMax), high=run(feeMin);
  // returns cost: cancelled orders paid Ozon fee+ads but yielded no revenue (cogs recovered)
  const rShip=view.returns.ship;
  const retCost=(c.feeOff?0:rShip*avg/100)+(c.adsOff?0:rShip*(+c.ads||0)/100);
  const net=main.net-retCost;
  // pending (в обработке): same calc on processing revenue, by average rate
  const pendingNet = (proc.ship>0)? runFor(proc.ship,proc.qty)(avg).net : 0;
  const unitPrice=qty?price/qty:price;
  const f=c.feeOff?0:avg/100, a=c.adsOff?0:(+c.ads||0)/100;
  let be; if(c.taxMode==='usn6') be=unitPrice*(1-f-a-0.06);
  else if(c.taxMode==='usn15') be=unitPrice*(0.99-f-a);
  else if(c.taxMode==='other') be=unitPrice*(1-f-a-(+c.otherRate||0)/100);
  else be=unitPrice*(1-f-a);
  let bonus=null;
  if(!c.paidOff && paid>0 && paid<price){ const ball=price-paid; bonus={ball,covered:Math.min(ball,main.fFee),feeCash:Math.max(0,main.fFee-ball),premium:Math.max(0,ball-main.fFee)}; }
  return {c,price,paid,qty,avg,feeMin,feeMax,main,low,high,net,retCost,
    delivered:del, processing:proc, pendingNet,
    totalShip:del.ship+proc.ship, totalPaid:del.paid+proc.paid,
    approx:!c.feeOff && feeMin!==feeMax,
    marginPct: price? net/price*100 : 0,
    roiPct: (!c.cogsOff && (+c.cogs||0))? net/((+c.cogs)*qty)*100 : null,
    breakeven: Math.max(0,be), bonus, returnsCount:view.returns.count};
}

/* ===================== CHART DRAWING (reusable SVG markup) ===================== */
function niceStep(max, maxTicks){
  const raw=Math.max(max/maxTicks,1);
  const mag=Math.pow(10,Math.floor(Math.log10(raw)));
  const norm=raw/mag;
  const nice = norm<=1?1 : norm<=2?2 : norm<=5?5 : 10;
  return Math.max(1, Math.round(nice*mag));
}
function chartMarkup(data,ox,oy,W,H){
  const gutter=34,padTop=22,padBottom=28,rightPad=8;
  const plotX=ox+gutter, plotTop=oy+padTop;
  const plotW=W-gutter-rightPad, plotH=H-padTop-padBottom;
  const max=Math.max(...data,1);
  const step=niceStep(max,8);
  const top=Math.ceil(max/step)*step;
  const y=v=>plotTop+plotH-(v/top)*plotH;
  const n=24,gap=6,bw=(plotW-gap*(n-1))/n;
  const peakIdx=data.indexOf(max);
  let s='';
  for(let g=0;g<=top;g+=step){
    const yy=y(g).toFixed(1);
    s+=`<line x1="${plotX}" y1="${yy}" x2="${ox+W-rightPad}" y2="${yy}" stroke="${C.GRID}" stroke-width="1"/>`;
    s+=`<text x="${plotX-6}" y="${(+yy+3).toFixed(1)}" text-anchor="end" font-size="9" fill="${C.INKSOFT}" font-family="Segoe UI,Arial,sans-serif">${g}</text>`;
  }
  data.forEach((v,i)=>{
    const x=plotX+i*(bw+gap);
    const bh=(v/top)*plotH, yy=plotTop+plotH-bh, isPeak=(v>0&&i===peakIdx);
    s+=`<rect x="${x.toFixed(1)}" y="${yy.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(bh,0).toFixed(1)}" rx="2.5" fill="${isPeak?C.PEAK:C.BAR}" style="animation-delay:${(i*7)}ms"/>`;
    if(v>0) s+=`<text x="${(x+bw/2).toFixed(1)}" y="${(yy-5).toFixed(1)}" text-anchor="middle" font-size="9.5" font-weight="700" fill="${isPeak?C.PEAKINK:C.INK}" font-family="Segoe UI,Arial,sans-serif">${v}</text>`;
    s+=`<text x="${(x+bw/2).toFixed(1)}" y="${(oy+H-10).toFixed(1)}" text-anchor="middle" font-size="8.5" fill="${C.INKSOFT}" font-family="Segoe UI,Arial,sans-serif">${String(i).padStart(2,'0')}</text>`;
  });
  return s;
}
function peakInfo(data){
  const max=Math.max(...data);
  if(max<=0) return null;
  const idx=data.indexOf(max);
  const ties=data.reduce((a,v,i)=>(v===max?[...a,i]:a),[]);
  return {idx,val:max,hh:String(idx).padStart(2,'0'),hh2:String(idx+1).padStart(2,'0'),ties};
}
// generic vertical bar chart for arbitrary N bars (used for daily money charts)
function vbarMarkup(values,labels,ox,oy,W,H,opts){
  opts=opts||{};
  const fmt=opts.fmt||(v=>String(v)), yfmt=opts.yfmt||(v=>String(v));
  const barColor=opts.color||C.BAR, peakColor=opts.peakColor||C.PEAK;
  const gutter=opts.gutter||52, padTop=22, padBottom=30, rightPad=10;
  const plotX=ox+gutter, plotTop=oy+padTop, plotW=W-gutter-rightPad, plotH=H-padTop-padBottom;
  const max=Math.max(...values,1), step=niceStep(max,opts.ticks||6), top=Math.ceil(max/step)*step;
  const y=v=>plotTop+plotH-(v/top)*plotH;
  const n=values.length, gap=n>20?2:(n>12?4:7), bw=(plotW-gap*(n-1))/Math.max(n,1);
  const peakIdx=values.indexOf(max);
  const F='font-family="Segoe UI,Arial,sans-serif"';
  let s='';
  for(let g=0;g<=top+0.5;g+=step){ const yy=y(g).toFixed(1);
    s+=`<line x1="${plotX}" y1="${yy}" x2="${ox+W-rightPad}" y2="${yy}" stroke="${C.GRID}" stroke-width="1"/>`;
    s+=`<text x="${plotX-6}" y="${(+yy+3).toFixed(1)}" text-anchor="end" font-size="9" fill="${C.INKSOFT}" ${F}>${yfmt(g)}</text>`;
  }
  const showVals = opts.showValues!==false && bw>=22;
  const labStep = n>40?Math.ceil(n/40):1;
  values.forEach((v,i)=>{
    const x=plotX+i*(bw+gap), bh=(v/top)*plotH, yy=plotTop+plotH-bh, isPeak=(v>0&&i===peakIdx);
    s+=`<rect x="${x.toFixed(1)}" y="${yy.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(bh,0).toFixed(1)}" rx="2.5" fill="${isPeak?peakColor:barColor}"/>`;
    if(showVals&&v>0) s+=`<text x="${(x+bw/2).toFixed(1)}" y="${(yy-5).toFixed(1)}" text-anchor="middle" font-size="8.5" font-weight="700" fill="${isPeak?C.PEAKINK:C.INK}" ${F}>${fmt(v)}</text>`;
    if(i%labStep===0) s+=`<text x="${(x+bw/2).toFixed(1)}" y="${(oy+H-10).toFixed(1)}" text-anchor="middle" font-size="8.5" fill="${C.INKSOFT}" ${F}>${labels[i]||''}</text>`;
  });
  return s;
}
// horizontal bars for delivery clusters
function clusterMarkup(entries,ox,oy,W,H){
  const F='font-family="Segoe UI,Arial,sans-serif"'; const n=entries.length; if(!n) return '';
  const nameW=Math.min(210,W*0.34), gap=10, valW=46;
  const barX=ox+nameW+gap, barMaxW=W-nameW-gap-valW-6;
  const rowH=H/n, barH=Math.min(16,rowH*0.56);
  const max=Math.max(...entries.map(e=>e.val),1);
  let s='';
  entries.forEach((e,i)=>{
    const cy=oy+i*rowH+rowH/2, bw=Math.max((e.val/max)*barMaxW,e.val>0?3:0), isTop=i===0;
    s+=`<text x="${(ox+nameW).toFixed(1)}" y="${(cy+4).toFixed(1)}" text-anchor="end" font-size="11" fill="${C.INK}" ${F}>${escapeHtml(clip(e.name,28))}</text>`;
    s+=`<rect x="${barX.toFixed(1)}" y="${(cy-barH/2).toFixed(1)}" width="${bw.toFixed(1)}" height="${barH.toFixed(1)}" rx="4" fill="${isTop?C.PEAK:C.BAR}"/>`;
    s+=`<text x="${(barX+bw+6).toFixed(1)}" y="${(cy+4).toFixed(1)}" font-size="11" font-weight="700" fill="${isTop?C.PEAKINK:C.INK}" ${F}>${e.val}</text>`;
  });
  return s;
}
function clusterEntries(p){ return Object.keys(p.clusters||{}).map(k=>({name:k,val:p.clusters[k]})).sort((a,b)=>b.val-a.val||a.name.localeCompare(b.name,'ru')); }

/* ===================== STORAGE LAYER ===================== */
// In the .exe (Electron) build, window.fileStore writes JSON files into %AppData%\Roaming\Аналитика магазина\store.
// In a plain browser, it falls back to localStorage.
const store = (typeof window!=='undefined' && window.fileStore) ? window.fileStore : {
  get:k=>{ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set:(k,v)=>{ try{ localStorage.setItem(k,v); return true; }catch(e){ return false; } },
  remove:k=>{ try{ localStorage.removeItem(k); return true; }catch(e){ return false; } },
};
const usingFileStore = !!(typeof window!=='undefined' && window.fileStore);
// one-time move of any existing browser-stored data into the file store (Electron only)
function migrateBrowserToFileStore(){
  if(!usingFileStore) return;
  try{
    if(store.get(PROFILES_KEY)) return; // already have file data
    const idxRaw = (typeof localStorage!=='undefined') ? localStorage.getItem(PROFILES_KEY) : null;
    if(idxRaw){
      store.set(PROFILES_KEY, idxRaw);
      const act=localStorage.getItem(ACTIVE_KEY); if(act) store.set(ACTIVE_KEY, act);
      const idx=JSON.parse(idxRaw)||[];
      for(const p of idx){ const d=localStorage.getItem(PKEY(p.id)); if(d) store.set(PKEY(p.id), d); }
    } else {
      const legacy=(typeof localStorage!=='undefined')?localStorage.getItem(STORE_KEY):null;
      if(legacy) store.set(STORE_KEY, legacy);
    }
    const ch=(typeof localStorage!=='undefined')?localStorage.getItem(CHART_KEY):null;
    if(ch && !store.get(CHART_KEY)) store.set(CHART_KEY, ch);
  }catch(e){}
}

function saveProfilesIndex(){ if(store.set(PROFILES_KEY,JSON.stringify(PROFILES))===false) storageOK=false; }
function loadProfilesIndex(){ try{ const raw=store.get(PROFILES_KEY); if(raw) PROFILES=JSON.parse(raw)||[]; }catch(e){ storageOK=false; } }
function saveActive(){ store.set(ACTIVE_KEY, activeId||''); }
function loadActive(){ try{ activeId=store.get(ACTIVE_KEY)||null; }catch(e){} }
function saveProfileData(id,data){ memData[id]=data; if(store.set(PKEY(id),JSON.stringify(data))===false) storageOK=false; }
function loadProfileData(id){ if(memData[id]) return memData[id]; try{ const raw=store.get(PKEY(id)); if(raw){ const d=JSON.parse(raw); memData[id]=d; return d; } }catch(e){} return null; }
function deleteProfileData(id){ delete memData[id]; store.remove(PKEY(id)); }

function newId(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function activeProfile(){ return PROFILES.find(p=>p.id===activeId)||null; }

function createProfile(name){
  const id=newId();
  PROFILES.push({id,name:name.trim()||('Профиль '+(PROFILES.length+1)),createdAt:Date.now(),productCount:0,minDate:null,maxDate:null,savedName:null});
  activeId=id; DATA=null; selectedSku=null;
  saveProfilesIndex(); saveActive();
  return id;
}
function switchProfile(id){
  if(id===activeId){ return; }
  activeId=id; DATA=loadProfileData(id);
  selectedSku = (DATA && DATA.products && DATA.products.length) ? bestFirst(DATA.products)[0].sku : null;
  saveActive();
}
function deleteProfile(id){
  deleteProfileData(id);
  PROFILES=PROFILES.filter(p=>p.id!==id);
  saveProfilesIndex();
  if(activeId===id){
    if(PROFILES.length){ activeId=PROFILES[0].id; DATA=loadProfileData(activeId); selectedSku=(DATA&&DATA.products&&DATA.products.length)?bestFirst(DATA.products)[0].sku:null; }
    else { activeId=null; DATA=null; selectedSku=null; }
    saveActive();
  }
}
function updateActiveIndexMeta(){
  const p=activeProfile(); if(!p||!DATA) return;
  p.productCount=DATA.meta.productCount; p.minDate=DATA.meta.minDate; p.maxDate=DATA.meta.maxDate; p.savedName=DATA.savedName;
  saveProfilesIndex();
}
function migrateLegacyStore(){
  // one-time: if an old single-store dataset exists and there are no profiles, wrap it as a profile
  if(PROFILES.length) return;
  try{
    const raw=store.get(STORE_KEY);
    if(raw){
      const d=JSON.parse(raw);
      const id=newId();
      PROFILES=[{id,name:'Мой магазин',createdAt:Date.now(),productCount:d.meta?d.meta.productCount:0,minDate:d.meta?d.meta.minDate:null,maxDate:d.meta?d.meta.maxDate:null,savedName:d.savedName||null}];
      activeId=id; memData[id]=d;
      store.set(PKEY(id),raw); store.remove(STORE_KEY);
      saveProfilesIndex(); saveActive();
    }
  }catch(e){}
}

function saveCharts(){ store.set(CHART_KEY,JSON.stringify({period:selectedPeriodDays})); }

/* ===================== FILE HANDLING ===================== */
function handleFile(file){
  const reader=new FileReader();
  reader.onload=e=>{
    const res=processCSV(e.target.result);
    if(res.error){toast(res.error);return;}
    if(!activeId){ createProfile(file.name.replace(/\.csv$/i,'')||'Профиль 1'); }
    DATA={products:res.products,meta:res.meta,savedName:file.name,savedAt:Date.now()};
    selectedSku=DATA.products.length?bestFirst(DATA.products)[0].sku:null;
    saveProfileData(activeId,DATA); updateActiveIndexMeta(); render();
    toast(storageOK?`Загружено в «${activeProfileName()}»: ${res.meta.productCount} товаров.`:`Загружено: ${res.meta.productCount} товаров.`);
  };
  reader.readAsText(file,'UTF-8');
}
function totalQtyOf(p){ let s=0; for(const r of p.recs) s+=r.q; return s; }
function bestFirst(list){return [...list].sort((a,b)=>totalQtyOf(b)-totalQtyOf(a));}
function winCache(){
  if(!DATA._win || DATA._win.period!==selectedPeriodDays){
    const perSku={}; for(const p of DATA.products) perSku[p.sku]=computeAgg(p.recs,selectedPeriodDays);
    DATA._win={period:selectedPeriodDays, perSku};
  }
  return DATA._win;
}
function productAgg(sku){ return winCache().perSku[sku]; }
function qtyWin(p){ const a=productAgg(p.sku); return a?a.qty:0; }

/* ===================== SORTING / FILTER ===================== */
function visibleProducts(){
  let list=DATA.products.filter(p=>{
    if(!query) return true;
    const q=query.toLowerCase();
    return p.name.toLowerCase().includes(q)||p.sku.toLowerCase().includes(q);
  });
  if(sortMode==='sales_desc') list.sort((a,b)=>qtyWin(b)-qtyWin(a)||a.name.localeCompare(b.name,'ru'));
  else if(sortMode==='sales_asc') list.sort((a,b)=>qtyWin(a)-qtyWin(b)||a.name.localeCompare(b.name,'ru'));
  else list.sort((a,b)=>a.name.localeCompare(b.name,'ru'));
  return list;
}

function sparkMarkup(data){
  const w=118,h=24,n=24,gap=1.4,bw=(w-gap*(n-1))/n,max=Math.max(...data,1);
  let s=`<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">`;
  data.forEach((v,i)=>{const bh=Math.max((v/max)*h,v>0?1.2:0);s+=`<rect x="${(i*(bw+gap)).toFixed(1)}" y="${(h-bh).toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" rx="1" fill="${C.BAR}" opacity="0.6"/>`;});
  return s+'</svg>';
}

function chartBlockView(title,span,data,total){
  const peak=peakInfo(data);
  let peakCard='';
  if(peak){
    const tie = peak.ties.length>1 ? ` (ещё ${peak.ties.length-1} час${peak.ties.length-1>1?'а':''} с тем же значением)` : '';
    peakCard=`<div class="peakcard"><span class="dot"></span><div class="t"><b>Пик: ${peak.hh}:00–${peak.hh2}:00</b> — ${peak.val} ед.${tie}</div></div>`;
  }
  const body = total>0
    ? `<svg class="chart" viewBox="0 0 1040 280">${chartMarkup(data,0,0,1040,280)}</svg>`
    : `<div class="noorders">Нет заказов за этот период</div>`;
  const best = peak?`${peak.hh}:00`:'—';
  return `<div class="panel">
    <div class="panel-head"><h3>${title}</h3><span class="span">${span}</span></div>
    <div class="stats">
      <div class="stat"><div class="n">${total}</div><div class="l">единиц</div></div>
      <div class="stat"><div class="n">${best}</div><div class="l">лучший час</div></div>
    </div>
    ${peakCard}${body}
  </div>`;
}

function statusNote(v){
  const parts=[`<b>${v.qty}</b> ед. всего`];

  parts.push(`возвраты ${v.returns.count}`);
  return `<div class="statusnote">Учтены все заказы за период (важны как интервалы времени): ${parts.join(' · ')}.</div>`;

function dayChartWidth(n){ return Math.max(1000, 64 + n*54); }

  else if(n<=16){
    body=`<svg class="chart" viewBox="0 0 1000 ${H}">${vbarMarkup(values,labels,0,0,1000,H,{color,fmt:fmtMoney,yfmt:moneyShort})}</svg>`;
  } else {
    const W=dayChartWidth(n);
    body=`<div class="daychart-scroll"><svg class="daychart" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${vbarMarkup(values,labels,0,0,W,H,{color,fmt:fmtMoney,yfmt:moneyShort})}</svg></div><div class="scroll-hint">← прокрутите, чтобы увидеть все дни →</div>`;
  }

    <div class="stats"><div class="stat"><div class="n">${fmtMoney(total)} ₽</div><div class="l">итого за период</div></div></div>

}

function calcResultHTML(sku,pr){
  const price=pr.price, maxBar=Math.max(price,1);
  const rowsData=[
    {l:`Себестоимость${pr.qty?` (${fmtMoney(+pr.c.cogs||0)} ₽ × ${pr.qty})`:''}`, v:pr.main.fCogs, c:'#C7A15C', show:!pr.c.cogsOff && pr.main.fCogs>0},
    {l:`Расходы Ozon · ${pr.c.model==='fbo'?'FBO':'FBS'} (≈${pct1(pr.avg)})`, v:pr.main.fFee, c:'#A7B7BB', show:!pr.c.feeOff && pr.main.fFee>0},
    {l:`Реклама / ДРР (${pct1(+pr.c.ads||0)})`, v:pr.main.fAds, c:'#7E9AA0', show:!pr.c.adsOff && pr.main.fAds>0},
    {l: pr.c.taxMode==='usn6'?'Налог УСН 6% (с выручки)': pr.c.taxMode==='usn15'?(pr.main.isMin?'Налог УСН — мин. 1% с выручки':'Налог УСН 15% (с прибыли)'): pr.c.taxMode==='other'?`Налог ${pct1(+pr.c.otherRate||0)} (с выручки)`:'Налог', v:pr.main.tax, c:'#9B8BB0', show:pr.c.taxMode!=='none' && pr.main.tax>0},
    {l:`Возвраты · ${pr.returnsCount} шт (расходы Ozon + реклама)`, v:pr.retCost, c:'#C0473C', show:pr.retCost>0},
  ].filter(r=>r.show);
  const rowHTML=rowsData.map(r=>`<div class="wf-row"><div class="wf-l">${r.l}</div><div class="wf-bar"><i style="width:${Math.min(100,r.v/maxBar*100).toFixed(1)}%;background:${r.c}"></i></div><div class="wf-v">−${fmtMoney(r.v)} ₽</div></div>`).join('');
  const net=pr.net, netCls=net>=0?'profit':'loss';
  const approx = pr.approx?`<div class="wf-approx">≈ приблизительно · диапазон ${fmtMoney(pr.high.net-pr.retCost)} … ${fmtMoney(pr.low.net-pr.retCost)} ₽ (ставка ${pct1(pr.feeMin)}–${pct1(pr.feeMax)})</div>`:'';
  const pending = pr.processing.ship>0
    ? `<div class="wf-pending">Ещё <b>${fmtMoney(pr.pendingNet)} ₽</b> в обработке (${pr.processing.qty} ед. со статусами «Доставляется», «Ожидает…») — сумма не финальная, товар ещё не доставлен.</div>`
    : '';
  const metrics=`<div class="cmetrics">
     <div class="cm"><div class="cm-l">Маржа с цены</div><div class="cm-v ${net>=0?'profit':'loss'}">${pct1(pr.marginPct)}</div></div>
     <div class="cm"><div class="cm-l">ROI на закупку</div><div class="cm-v">${pr.roiPct==null?'—':pct1(pr.roiPct)}</div></div>
     <div class="cm"><div class="cm-l">Себестоимость в ноль</div><div class="cm-v">${fmtMoney(pr.breakeven)} ₽<small>/ед.</small></div></div>
   </div>`;
  let bonus='';
  if(pr.bonus){ const b=pr.bonus; bonus=`<div class="bonuscard">
     <div class="bc-h">Расчёт по баллам (соинвест Ozon)</div>
     <div class="bc-row"><span>Начислено баллами</span><b>${fmtMoney(b.ball)} ₽</b></div>
     <div class="bc-row"><span>Покрыто расходов Ozon</span><b>${fmtMoney(b.covered)} ₽</b></div>
     <div class="bc-row"><span>Осталось расходов деньгами</span><b>${fmtMoney(b.feeCash)} ₽</b></div>
     ${b.premium>0?`<div class="bc-row"><span>Остаток баллов → премия</span><b>${fmtMoney(b.premium)} ₽</b></div>`:''}
     <div class="bc-note">Баллы не меняют итоговую прибыль — лишь перераспределяют расходы. Налог считается с цены продажи.</div>
   </div>`; }
  return `<div class="wf">
     <div class="wf-row wf-rev"><div class="wf-l">Выручка · доставлено${pr.qty?` (${pr.delivered.count} зак.)`:''}</div><div class="wf-bar"></div><div class="wf-v">${fmtMoney(price)} ₽</div></div>
     ${rowHTML}
     <div class="wf-net"><span>Чистая прибыль${pr.approx?' ≈':''}</span><b class="${netCls}">${fmtMoney(net)} ₽</b></div>
     ${approx}${pending}
   </div>${metrics}${bonus}
   <div class="calc-hint">Данные калькулятора сохраняются по SKU и подтягиваются в любом профиле с этим товаром. Прибыль приблизительная: ставка Ozon плавающая, финальные значения — в детализации кабинета.</div>`;
}
function profitBody(sku,pr){

     <div id="calcInputs">${calcInputsHTML(sku,pr)}</div>
   </div>

     <div class="panel-head"><h3>Результат</h3><span class="span">чистая прибыль за период</span></div>
     <div id="calcResult">${calcResultHTML(sku,pr)}</div>
   </div>`;

function storeProfitReport(){
  const c=winCache(); const items=[];
  for(const p of DATA.products){ if(!calcComplete(p.sku)) continue; const pr=profitFor(p.sku,c.perSku[p.sku]); items.push({name:p.name,net:pr.net}); }
  const totalN=DATA.products.length;
  if(!items.length){
    return `<div class="panel"><div class="panel-head"><h3>Чистая прибыль магазина</h3><span class="span">${periodLabel()}</span></div>
      <div class="noorders">Ни у одного товара пока не заполнен калькулятор.<br>Откройте товар → вкладка «Чистая прибыль», введите себестоимость и ставки — и товар появится в этом сводном отчёте.</div></div>`;
  }
  const total=items.reduce((a,i)=>a+i.net,0);
  items.sort((a,b)=>a.net-b.net);
  const maxAbs=Math.max(...items.map(i=>Math.abs(i.net)),1);
  const rows=items.map(i=>{ const pos=i.net>=0, w=Math.abs(i.net)/maxAbs*100;
    return `<div class="pf-row"><div class="pf-name" title="${escapeAttr(i.name)}">${escapeHtml(clip(i.name,42))}</div>
      <div class="pf-track"><i class="${pos?'pos':'neg'}" style="width:${w.toFixed(1)}%"></i></div>
      <div class="pf-val ${pos?'profit':'loss'}">${fmtMoney(i.net)} ₽</div></div>`; }).join('');
  return `<div class="panel">
    <div class="panel-head"><h3>Чистая прибыль магазина</h3><span class="span">${periodLabel()}</span></div>
    <div class="pf-note">Показаны только товары с полностью заполненным калькулятором: <b>${items.length}</b> из <b>${totalN}</b>. Остальные в сумму не входят.</div>
    <div class="pf-total ${total>=0?'profit':'loss'}">Итого чистая прибыль: <b>${fmtMoney(total)} ₽</b></div>
    <div class="pf-list">${rows}</div>
  </div>`;
}
function profitTabView(v){
  if(selectedSku===ALL_KEY) return storeProfitReport();
  const pr=profitFor(selectedSku,v);
  return `<div id="profitHost">${profitBody(selectedSku,pr)}</div>`;
}
function refreshCalc(full){
  const v=currentView(); const pr=profitFor(selectedSku,v);
  if(full){ const host=document.getElementById('calcInputs'); if(host) host.innerHTML=calcInputsHTML(selectedSku,pr); }
  const res=document.getElementById('calcResult'); if(res) res.innerHTML=calcResultHTML(selectedSku,pr);

function renderReportBlob(v){
  return new Promise((resolve,reject)=>{
    const {svg,W,H}=buildExportSVG(v);
    const scale=2, img=new Image();
    const blob=new Blob([svg],{type:'image/svg+xml;charset=utf-8'});
    const url=URL.createObjectURL(blob);
    img.onload=()=>{ const canvas=document.createElement('canvas'); canvas.width=W*scale; canvas.height=H*scale;
      const ctx=canvas.getContext('2d'); ctx.setTransform(scale,0,0,scale,0,0); ctx.drawImage(img,0,0,W,H);
      URL.revokeObjectURL(url); canvas.toBlob(b=>b?resolve(b):reject(new Error('toBlob failed')),'image/png'); };
    img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('image load failed'));};
    img.src=url;
  });
}

}

function copyReport(){
  if(!selectedSku) return;
  const v=currentView();
  if(!(navigator.clipboard && window.ClipboardItem)){ toast('Браузер не поддерживает копирование изображения'); return; }
  try{
    const item=new ClipboardItem({'image/png':renderReportBlob(v)});
    navigator.clipboard.write([item])
      .then(()=>toast('Отчёт скопирован в буфер'))
      .catch(()=>copyFallback(v));
  }catch(e){ copyFallback(v); }

function copyFallback(v){

    .catch(err=>toast('Не удалось скопировать ('+((err&&err.name)||'ошибка')+')'));

function gatherExport(){

  return { app:'ozon-analytics', version:3, exportedAt:new Date().toISOString(),
    index: store.get(PROFILES_KEY), active: store.get(ACTIVE_KEY),
    charts: store.get(CHART_KEY), calc: store.get(CALC_KEY), profiles };
}
function exportAll(){
  const text=JSON.stringify(gatherExport());
  const name='ozon-analytics-backup-'+new Date().toISOString().slice(0,10)+'.json';
  if(window.fileStore && window.fileStore.exportFile){
    window.fileStore.exportFile(name,text).then(res=>{
      if(res&&res.ok) toast('Данные сохранены в файл'); else if(!(res&&res.canceled)) toast('Не удалось сохранить файл');
    }).catch(()=>toast('Не удалось сохранить файл'));
  } else {
    const blob=new Blob([text],{type:'application/json'}); const a=document.createElement('a');

    setTimeout(()=>URL.revokeObjectURL(a.href),1500); toast('Файл данных скачан');
  }

function applyImport(bundle){
  let idx=[]; try{ idx=JSON.parse(store.get(PROFILES_KEY)||'[]')||[]; }catch(e){}
  let imp=[]; try{ imp=JSON.parse(bundle.index||'[]')||[]; }catch(e){}
  const byId={}; for(const p of idx) byId[p.id]=p; for(const p of imp) byId[p.id]=p;
  store.set(PROFILES_KEY, JSON.stringify(Object.values(byId)));
  for(const id in (bundle.profiles||{})) store.set(PKEY(id), bundle.profiles[id]);
  let calcCur={}; try{ calcCur=JSON.parse(store.get(CALC_KEY)||'{}')||{}; }catch(e){}
  let calcImp={}; try{ calcImp=JSON.parse(bundle.calc||'{}')||{}; }catch(e){}
  store.set(CALC_KEY, JSON.stringify(Object.assign({}, calcCur, calcImp)));
  if(bundle.charts!=null && store.get(CHART_KEY)==null) store.set(CHART_KEY, bundle.charts);
  for(const k in memData) delete memData[k];
  PROFILES=[]; DATA=null; loadCalc(); loadCharts(); loadProfilesIndex(); loadActive();
  if(PROFILES.length){
    if(!activeId||!PROFILES.some(p=>p.id===activeId)) activeId=PROFILES[0].id;
    DATA=loadProfileData(activeId);
    if(DATA&&DATA.products&&DATA.products.length){ selectedSku=bestFirst(DATA.products)[0].sku; }
    saveActive();
  }
  drawerOpen=false; render(); updateDrawer();
}
function doImport(text){
  let bundle; try{ bundle=JSON.parse(text); }catch(e){ toast('Файл повреждён или неверного формата'); return; }
  if(!bundle || (bundle.app && bundle.app!=='ozon-analytics')){ toast('Это не файл данных приложения'); return; }
  const n=(()=>{ try{ return (JSON.parse(bundle.index||'[]')||[]).length; }catch(e){ return 0; } })();
  applyImport(bundle);
  toast('Импортировано профилей: '+n);
}
function importAll(){
  const ok=confirm('Импорт данных\n\nПрофили и настройки калькулятора из файла будут добавлены в приложение. Профили и товары с совпадающими идентификаторами будут перезаписаны версией из файла.\n\nРекомендуем сделать экспорт текущих данных перед импортом.\n\nПродолжить импорт?');
  if(!ok) return;
  if(window.fileStore && window.fileStore.importFile){
    window.fileStore.importFile().then(res=>{
      if(res&&res.ok) doImport(res.text); else if(!(res&&res.canceled)) toast('Не удалось открыть файл');
    }).catch(()=>toast('Не удалось открыть файл'));
  } else {
    const inp=document.createElement('input'); inp.type='file'; inp.accept='.json,application/json';
    inp.onchange=e=>{ const f=e.target.files[0]; if(!f) return; const rd=new FileReader(); rd.onload=()=>doImport(String(rd.result)); rd.readAsText(f,'UTF-8'); };
    inp.click();
  }
}

function escapeHtml(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function escapeAttr(s){return String(s).replace(/"/g,'&quot;').replace(/</g,'&lt;');}
function sanitize(s){return String(s).replace(/[\\/:*?"<>|]/g,' ').replace(/\s+/g,' ').trim();}
function clip(s,n){s=String(s);return s.length>n?s.slice(0,n-1)+'…':s;}

/* ===================== EVENT WIRING ===================== */
function wireUpload(){
  const drop=document.getElementById('drop');
  document.getElementById('pickBtn').onclick=()=>document.getElementById('fileInput').click();
  ['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('over');}));
  ['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('over');}));
  drop.addEventListener('drop',e=>{const f=e.dataTransfer.files[0];if(f)handleFile(f);});
}
function wireMasthead(){
  const nf=document.getElementById('newFileBtn'); if(nf) nf.onclick=()=>document.getElementById('fileInput').click();
}
function wireDetail(){
  const exp=document.getElementById('exportBtn'); if(exp) exp.onclick=exportPNG;

}
function wireSidebar(){
  const search=document.getElementById('search');
  if(search) search.oninput=e=>{query=e.target.value;refreshSidebar();};
  document.querySelectorAll('[data-sort]').forEach(b=>b.onclick=()=>{sortMode=b.dataset.sort;refreshSidebar();});
  document.querySelectorAll('[data-sku]').forEach(b=>b.onclick=()=>selectProduct(b.dataset.sku));
}
// select without rebuilding sidebar -> preserves list scroll position
function selectProduct(sku){
  selectedSku=sku;
  document.querySelectorAll('[data-sku]').forEach(c=>c.classList.toggle('sel', c.dataset.sku===sku));
  const d=document.getElementById('detail');
  if(d){ d.innerHTML=detailView(); wireDetail(); }
  if(window.innerWidth<=900 && d){ d.scrollIntoView({behavior:'smooth',block:'start'}); }
}
// re-render only sidebar (for sort/search); keeps search focus/caret
function refreshSidebar(){
  const app=document.getElementById('app');
  const side=app.querySelector('.side');
  const tmp=document.createElement('div'); tmp.innerHTML=sidebarView();
  side.replaceWith(tmp.firstElementChild);
  wireSidebar();
  const search=document.getElementById('search');
  if(search){ const v=search.value; search.focus(); search.value=''; search.value=v; }
}

/* ===================== GLOBAL FILE INPUT ===================== */
document.getElementById('fileInput').addEventListener('change',e=>{
  const f=e.target.files[0]; if(f) handleFile(f); e.target.value='';
});

/* ===================== INIT ===================== */
(function init(){
  try{const k='__probe__'; if(store.set(k,'1')===false) storageOK=false; store.remove(k);}catch(e){storageOK=false;}
  migrateBrowserToFileStore();
  loadCharts();
  loadCalc();
  loadProfilesIndex(); loadActive();
  migrateLegacyStore();
  if(PROFILES.length){
    if(!activeId || !PROFILES.some(p=>p.id===activeId)) activeId=PROFILES[0].id;
    DATA=loadProfileData(activeId);
    if(DATA && DATA.products && DATA.products.length) selectedSku=bestFirst(DATA.products)[0].sku;
    saveActive();
  }
  render();
})();
</script>
</body>
